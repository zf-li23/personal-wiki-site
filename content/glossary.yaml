# Concept registry (词条库). See CONTENT_GUIDE.md §6.
#
# Each entry names a concept shared across courses: { zh, en, aliases?, exclude? }.
# Where a concept is DEFINED is found in the content, not here:
#   - a 定义 label whose name is the concept:   **定义 13.1.1（依分布收敛）**
#   - or one English annotation at the definition:   中心极限定理（Central Limit Theorem）
# Every other page links its first mention to that definition.
# `exclude` lists longer words that contain the name but do not mean it (分岔图 vs 分岔).
# `scope` limits a concept to disciplines/courses (page ids) when the word means something else elsewhere.
