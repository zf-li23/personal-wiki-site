# Concept registry (词条库). See CONTENT_GUIDE.md §6.
#
# Each entry names a concept shared across courses: { zh, en, aliases?, scope? }.
# Where a concept is DEFINED is found in the content, not here:
#   - a 定义 label whose name is the concept:   **定义 13.1.1（依分布收敛）**
#   - a bold concept name inside a 定义 statement (the term being defined)
#   - otherwise one marked occurrence at the definition: 中心极限定理（Central Limit Theorem）
#     in Chinese, *central limit theorem* (italics) on pages written in English first
# A bold run whose whole text is a concept name (**群**) links to that definition; plain text is never matched.
# `scope` limits a concept to disciplines/courses (page ids) when the word means something else elsewhere;
# homonyms may share a name when their scopes do not overlap.
