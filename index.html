<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Personal Wiki · 个人知识库</title>
    <script>
      // Apply the theme before first paint (no flash). Keep in sync with src/lib/theme.tsx.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('wiki-theme'); } catch (e) {}
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:1rem">This site needs JavaScript for navigation. <a href="zh/">中文</a> · <a href="en/">English</a></p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
